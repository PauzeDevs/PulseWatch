name: PulseWatch Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pulsewatch-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run uptime checker tests
        run: node --test
      - name: Check configured websites
        run: node scripts/check.mjs
      - name: Commit monitoring data
        run: |
          if git diff --quiet -- data/status.json data/history.json; then
            echo "No monitoring data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json data/history.json
          git commit -m "(monitor): record website check results"
          git push
